name: FerrumOS CI & Automated Quality Assurance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-suite:
    name: Rust Core Tests & Edge Cases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Core Test Suite (40+ Tests)
        run: |
          cd core
          cargo test --verbose

  ui-verification:
    name: Web UI & Static Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c ui/public/app.js
          echo "JavaScript syntax validation PASSED (Zero errors)"

      - name: Check HTML & CSS Assets Integrity
        run: |
          test -s ui/public/index.html
          test -s ui/public/app.css
          test -s ui/public/app.js
          echo "All Web UI assets verified and present"

  architecture-audit:
    name: MIPS Firmware & Anti-Brick Protection Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Anti-Brick Safeguards
        run: |
          # Verify MTD0 and MTD2 cannot be modified
          grep -q "MTD0" core/src/system.rs
          grep -q "MTD2" core/src/system.rs
          grep -q "GPIO 13" ui/public/index.html
          echo "Anti-brick safety assertions verified"
